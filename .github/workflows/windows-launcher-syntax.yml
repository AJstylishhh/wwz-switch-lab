name: Windows launcher syntax

on:
  push:
    branches:
      - research/chatgpt-hydra-server-mvp
    paths:
      - "run_wwz_echo_test.ps1"
      - "WWZ_One_Click_Test.cmd"
      - ".github/workflows/windows-launcher-syntax.yml"
  pull_request:
    paths:
      - "run_wwz_echo_test.ps1"
      - "WWZ_One_Click_Test.cmd"
      - ".github/workflows/windows-launcher-syntax.yml"

permissions:
  contents: read

jobs:
  parse-powershell:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell script parses under Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $file = (Resolve-Path -LiteralPath 'run_wwz_echo_test.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PowerShell syntax valid"
      - name: Verify CMD invokes adjacent PS1 instead of remote code
        shell: powershell
        run: |
          $cmd = Get-Content 'WWZ_One_Click_Test.cmd' -Raw
          if ($cmd -notmatch 'powershell\.exe.*-File.*run_wwz_echo_test\.ps1') {
            throw "CMD must execute the local PS1 using -File"
          }
          if ($cmd -match 'Invoke-WebRequest|raw\.githubusercontent\.com') {
            throw "CMD unexpectedly includes remote script fetching"
          }
          Write-Host "CMD invokes adjacent PowerShell script"
